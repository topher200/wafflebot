services:
  file-downloader:
    volumes:
      - voice-memos:/app/data/voice-memos

  audio-mixer:
    volumes:
      - podcast-audio:/app/data/podcast
      - voice-memos:/app/data/voice-memos:ro
      - type: bind
        source: ${BACKGROUND_MUSIC_PATH}
        target: /app/data/background-music
        bind:
          create_host_path: false

  publish-to-dropbox:
    volumes:
      - podcast-audio:/app/data/podcast:ro
      - type: bind
        source: ${DROPBOX_OUTPUT_PATH}
        target: /app/data/dropbox-output
        bind:
          create_host_path: false

  publish-podcast-to-s3:
    volumes:
      - podcast-audio:/app/data/podcast:ro

  update-rss-feed:
    volumes:
      - rss-output:/app/data/rss

volumes:
  voice-memos:
    name: wafflebot-${ENVIRONMENT}-voice-memos
  podcast-audio:
    name: wafflebot-${ENVIRONMENT}-podcast-audio
  rss-output:
    name: wafflebot-${ENVIRONMENT}-rss-output
